<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>YouTube Time Tracker</h1>
  </header>

  <section class="stats">
    <div class="stat">
      <span class="label">Today</span>
      <span class="value" id="today">0m</span>
    </div>
    <div class="stat">
      <span class="label">Total</span>
      <span class="value" id="total">0m</span>
    </div>
  </section>

  <section>
    <h2>Last 7 days</h2>
    <div id="week" class="week"></div>
  </section>

  <footer>
    <span id="since"></span>
    <button id="reset" type="button">Reset</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
